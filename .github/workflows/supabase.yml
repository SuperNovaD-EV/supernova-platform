name: supabase

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase:start
      - run: pnpm supabase:reset
      - run: pnpm supabase:lint
      - run: pnpm supabase:test
      - run: pnpm exec supabase gen types typescript --local --schema public,app_private > /tmp/database.local.types.ts
      - run: pnpm supabase:types:verify packages/types/src/generated/database.types.ts /tmp/database.local.types.ts
